    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <button id="dark-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
    <nav id="role-nav" aria-label="CV role filter"></nav>
    <div class="a4-wrapper">
      <header class="cv-header" id="cv-header"></header>
      <div class="cv-body" id="cv-body"></div>
    </div>

    <!-- Apply dark mode before the module loads to prevent a flash of light mode -->
    <script>
      (function () {
        var savedTheme = localStorage.getItem('cv-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (savedTheme === null && prefersDark)) {
          document.body.classList.add('dark-mode');
          document.getElementById('dark-toggle').innerHTML =
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
        }
      })();
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
